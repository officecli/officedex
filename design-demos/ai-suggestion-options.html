<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeDex · AI 快捷建议方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#25282e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}header{max-width:1480px;margin:auto;padding:30px 24px 20px}h1{font-size:23px;letter-spacing:-.6px;margin:0 0 10px}header p{font-size:14px;color:#727781;margin:0 0 22px}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{border:1px solid #dddfe5;background:white;color:#555c68;padding:9px 15px;border-radius:9px;font-size:13px}.controls button[aria-pressed=true]{background:#282b33;color:white;border-color:#282b33}main{max-width:1480px;margin:auto;padding:0 24px 36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.option{min-width:0}.caption{height:74px;padding:8px 2px}.caption strong{font-size:15px}.caption p{font-size:12px;color:#777c86;line-height:1.5;margin:7px 0}.recommended{font-size:10px;color:#636f97;background:#e8ecf5;padding:3px 6px;border-radius:4px;margin-left:6px}.panel{height:650px;border:1px solid #e0e2e7;border-radius:14px;overflow:hidden;background:white;display:flex;flex-direction:column;box-shadow:0 5px 18px #25304706}.bar{height:56px;padding:0 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #eceef1;font-size:14px;font-weight:600}.spark{color:#7a65ac;background:#f0edf7;border-radius:8px;padding:5px 7px}.close{margin-left:auto;color:#9ca0aa;font-weight:400}.content{padding:25px 16px;flex:1;background-image:radial-gradient(circle,#6e698e13 .8px,transparent 1px);background-size:25px 25px}.content h2{font-size:14px;line-height:1.5;font-weight:500;margin:0 0 19px}.suggestions{display:flex;flex-direction:column;gap:9px}.suggestion{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font-size:13px;min-height:46px;padding:12px;color:#3b414c;transition:background 160ms,border-color 160ms,transform 160ms,box-shadow 160ms}.symbol{font-size:19px;width:23px;flex-shrink:0;text-align:center;font-weight:400}.label{flex:1}.arrow{font-size:15px;color:#9aa1ae}.suggestion:active{transform:scale(.98)}button:focus-visible,textarea:focus-visible{outline:2px solid #8474c9;outline-offset:3px}
.a .suggestion{border:1px solid #e6e8ed;background:#fff;border-radius:8px;box-shadow:0 2px 3px #1d253803}.a .symbol{color:#737a89}.a .suggestion:hover{border-color:#b7b1cc;background:#faf9fd;box-shadow:0 3px 10px #37305b0a}.a .suggestion:hover .symbol{color:#8066b0}
.b .suggestions{flex-direction:row;flex-wrap:wrap;gap:10px}.b .suggestion{width:auto;min-height:37px;border:1px solid #dce5e2;background:#f6faf8;border-radius:100px;padding:9px 14px;gap:7px;color:#40695d}.b .symbol{font-size:15px;width:17px}.b .arrow{display:none}.b .suggestion:hover{background:#e9f3ee;border-color:#a8c3b7}
.c .suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c .suggestion{min-height:99px;align-items:flex-start;flex-direction:column;gap:12px;border:1px solid #e9e4db;border-radius:10px;padding:14px;background:#faf7f0;color:#655443;position:relative}.c .suggestion:nth-child(2){background:#f4f4ed;border-color:#e4e5d9;color:#636949}.c .suggestion:nth-child(3){grid-column:1 / -1;min-height:52px;flex-direction:row;align-items:center;background:#f6f1ed;color:#79604e}.c .symbol{font-size:20px}.c .arrow{position:absolute;right:12px;bottom:12px;color:#b1a796}.c .suggestion:nth-child(3) .label{padding-right:10px}.c .suggestion:hover{box-shadow:0 5px 12px #6f543710;transform:translateY(-2px);border-color:#c8b99f}
.d .suggestions{gap:0;border:1px solid #e2e5ea;border-radius:12px;background:#fff;overflow:hidden}.d .suggestion{min-height:55px;border:0;border-radius:0;background:transparent;padding:14px;color:#424a58}.d .suggestion+.suggestion{border-top:1px solid #eef0f3}.d .symbol{color:#72839a;font-size:16px}.d .suggestion:hover{background:#f1f5fa}.d .arrow{font-size:12px}
.composer{margin:12px;border:1px solid #dcd8eb;border-radius:24px;background:linear-gradient(125deg,#f3f4f9,#f3eff8);overflow:hidden;box-shadow:0 6px 20px #51416a07}.composer:focus-within{border-color:#a498d1;box-shadow:0 0 0 3px #8a77be12}textarea{display:block;resize:none;width:100%;height:90px;border:0;background:transparent;padding:16px;color:#51505f;font-size:13px;line-height:1.6;outline:none!important}textarea::placeholder{color:#a3a4af}.footer{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid #e3e0eb;font-size:11px;color:#8d879e}.send{border:1px solid #d2cedc;width:34px;height:34px;border-radius:50%;background:transparent;color:#9994a4;font-size:20px}.send:not(:disabled){color:white;border-color:transparent;background:linear-gradient(130deg,#637bce,#855dc1)}.status{min-height:18px;margin-top:12px;color:#7b7196;font-size:11px}.pick{width:100%;margin-top:12px;border:1px solid #d8dbe2;border-radius:9px;padding:10px;background:white;color:#535b69;font-size:13px}.pick.selected{color:#674d9a;background:#f1ecf9;border-color:#b9a5d7}main.focused{grid-template-columns:360px;justify-content:center}.option[hidden]{display:none}#selection{font-size:13px;color:#6a5d8c;padding:12px 0 0;min-height:30px}@media(max-width:1120px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:610px){main{grid-template-columns:1fr;padding:0 16px 24px}main.focused{grid-template-columns:minmax(0,360px)}header{padding:24px 16px}.panel{height:590px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.suggestion:hover,.suggestion:active{transform:none}}

/* Document themes: shared by every suggestion within the active document. */
body{--theme:#b85c25;--tint:#fff8f2;--hover:#fff0e2;--line:#eddbc9}
.type-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}.type-controls>span{font-size:12px;color:#747b85;margin-right:4px}.type-controls button{padding:7px 12px;border:1px solid #e0e3e8;border-radius:7px;background:white;color:#626976;font-size:12px}.type-controls button[aria-pressed=true]{color:var(--theme);border-color:var(--line);background:var(--hover)}
.a .suggestion{border-color:var(--line)}
.a .symbol,.a .suggestion:hover .symbol,.b .symbol,.c .symbol,.d .symbol{color:var(--theme)}
.a .suggestion:hover,.b .suggestion:hover,.c .suggestion:hover,.d .suggestion:hover{background:var(--hover);border-color:var(--theme);box-shadow:0 3px 10px color-mix(in srgb,var(--theme) 8%,transparent)}
.b .suggestion,.c .suggestion:nth-child(n){background:var(--tint);border-color:var(--line);color:var(--theme)}
.b .suggestion:hover,.c .suggestion:nth-child(n):hover{background:var(--hover);border-color:var(--theme)}
.d .suggestions{border-color:var(--line)}.d .suggestion+.suggestion{border-top-color:var(--line)}
.footer>span{color:var(--theme)}.doc-badge{font-size:10px;color:var(--theme);background:var(--tint);padding:4px 6px;border-radius:4px;font-weight:500}

/* Neutral AI chrome; document color appears only on actionable details. */
.spark{background:#f2f3f5;color:var(--theme)}
.composer{border-color:#dfe2e7;background:linear-gradient(180deg,#fcfcfd,#f7f8fa);box-shadow:0 6px 20px #28304205}
.composer:focus-within{border-color:color-mix(in srgb,var(--theme) 48%,#dfe2e7);box-shadow:0 0 0 3px color-mix(in srgb,var(--theme) 9%,transparent)}
textarea{color:#414751}textarea::placeholder{color:#979da7}
.footer{border-color:#e7e9ed}.footer>span{color:#7b828c}.selection-icon{color:var(--theme);margin-right:5px}
.send{border-color:#d8dce2;color:#969ca6;background:transparent;transition:background 160ms,transform 160ms,box-shadow 160ms}
.send:not(:disabled){background:var(--theme);color:white;box-shadow:0 2px 6px color-mix(in srgb,var(--theme) 18%,transparent)}
.send:hover:not(:disabled){filter:brightness(1.08)}.send:active:not(:disabled){transform:scale(.95)}
button:focus-visible,textarea:focus-visible{outline-color:var(--theme)}
.status,#selection{color:#747b85}.recommended{color:#606875;background:#e9edf2}
.pick.selected{color:var(--theme);background:var(--tint);border-color:var(--line)}
@media(prefers-reduced-motion:reduce){.send:active:not(:disabled){transform:none}}
</style>
<header><h1>AI 快捷建议 · 四种方向</h1><p>切换文档类型，比较同一主题色下的四种形状。标题与输入框采用中性色；聚焦、发送和图标跟随文档主题色。点击建议体验。</p><div class="controls" aria-label="切换预览"><button aria-pressed="true" data-view="all">并排比较</button><button aria-pressed="false" data-view="a">A · 轻描边</button><button aria-pressed="false" data-view="b">B · 胶囊标签</button><button aria-pressed="false" data-view="c">C · 主题色小磁贴</button><button aria-pressed="false" data-view="d">D · 分组列表</button></div><div class="type-controls" aria-label="文档类型"><span>文档主题</span><button data-type="PPTX" aria-pressed="true">PPTX · 橙</button><button data-type="DOCX" aria-pressed="false">DOCX · 蓝</button><button data-type="XLSX" aria-pressed="false">XLSX · 绿</button><button data-type="Image" aria-pressed="false">Image · 紫</button><button data-type="PDF" aria-pressed="false">PDF · 红</button></div><div id="selection" role="status"></div></header>
<main id="options"></main>
<script>
const variants=[['a','A · 轻描边','白底、浅主题色边框，主题色仅点亮图标。'],['b','B · 胶囊标签','按文字自然宽度排列，低饱和主题色。'],['c','C · 主题色小磁贴','错落的块面，三项使用同一浅主题色。'],['d','D · 分组列表','三项合为一组，主题色图标，更像编辑工具。']];
const labels=['Simplify text','Improve layout','Unify the style'];const symbols=['≡','▤','◈'];const prompts=['Simplify the text on the selected slide while preserving its key information.','Improve the layout of the selected slide: align elements and clarify the visual hierarchy.','Unify the fonts, colors, and spacing on the selected slide to match the presentation.'];
const main=document.getElementById('options');
main.innerHTML=variants.map(([id,title,desc])=>`<section class="option ${id}" data-id="${id}"><div class="caption"><strong>${title}</strong>${id==='a'?'<span class="recommended">推荐</span>':''}<p>${desc}</p></div><div class="panel"><div class="bar"><span class="spark" aria-hidden="true">✧</span>Edit with AI<span class="doc-badge">PPTX</span><span class="close" aria-hidden="true">↻ &nbsp; ×</span></div><div class="content"><h2>How would you like to improve this slide?</h2><div class="suggestions">${labels.map((label,i)=>`<button class="suggestion" data-index="${i}"><span class="symbol" aria-hidden="true">${symbols[i]}</span><span class="label">${label}</span><span class="arrow" aria-hidden="true">${id==='d'?'›':'↗'}</span></button>`).join('')}</div><div class="status" role="status"></div></div><div class="composer"><textarea aria-label="${title} 修改要求" placeholder="Describe the change to make…"></textarea><div class="footer"><span><span class="selection-icon" aria-hidden="true">▱</span> Selected: 1 slide</span><button class="send" aria-label="体验发送" disabled>↑</button></div></div></div><button class="pick">选择 ${title}</button></section>`).join('');
main.querySelectorAll('.option').forEach(section=>{const input=section.querySelector('textarea'),send=section.querySelector('.send');section.querySelectorAll('.suggestion').forEach(button=>button.onclick=()=>{input.value=prompts[Number(button.dataset.index)];send.disabled=false;input.focus();});input.oninput=()=>send.disabled=!input.value.trim();send.onclick=()=>{section.querySelector('.status').textContent='演示：修改要求已提交';input.value='';send.disabled=true;};section.querySelector('.pick').onclick=e=>{main.querySelectorAll('.pick').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});e.currentTarget.classList.add('selected');e.currentTarget.setAttribute('aria-pressed','true');document.getElementById('selection').textContent=`当前选择：${variants.find(v=>v[0]===section.dataset.id)[1]}。回到对话告诉我方案字母即可。`;};});
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));main.classList.toggle('focused',button.dataset.view!=='all');main.querySelectorAll('.option').forEach(s=>s.hidden=button.dataset.view!=='all'&&s.dataset.id!==button.dataset.view);});

const themes={PPTX:['#b85c25','#fff8f2','#fff0e2','#eddbc9','slide'],DOCX:['#356cba','#f6f9ff','#eaf2ff','#d3dfef','paragraph'],XLSX:['#287b57','#f5faf7','#e7f4ec','#cfe5d8','range'],Image:['#8455b1','#faf7fd','#f1e9fa','#e1d5ed','image'],PDF:['#b74e51','#fff7f7','#fdeced','#eed5d6','page']};
document.querySelectorAll('[data-type]').forEach(button=>button.onclick=()=>{const name=button.dataset.type;const [color,tint,hover,line,unit]=themes[name];['--theme','--tint','--hover','--line'].forEach((key,i)=>document.body.style.setProperty(key,[color,tint,hover,line][i]));document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.doc-badge').forEach(b=>b.textContent=name);document.querySelectorAll('.footer>span').forEach(b=>b.innerHTML='<span class="selection-icon" aria-hidden="true">▱</span> Selected: 1 '+unit);document.querySelectorAll('.content h2').forEach(h=>h.textContent='How would you like to improve this '+unit+'?');document.getElementById('selection').textContent='当前文档主题：'+name;});
</script>
</html>
