name: CI

on:
  pull_request:
    branches: [main, develop/**]
  push:
    branches: [main, develop/**]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      WAILS_VERSION: v2.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan the tree for secrets and internal references (gitleaks)
        # Scans the checked-out files, not the git history, with the custom
        # rules in .gitleaks.toml: built-in secret detectors plus the internal
        # hostnames and /Users/<name> paths that must not reach the public repo.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir . \
            --config .gitleaks.toml \
            --no-banner \
            --redact=0 \
            --exit-code 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install npm dependencies
        run: npm ci

      - name: Stub dist/ so `wails generate module` can compile main.go
        # Mirrors release.yml: main.go has `//go:embed all:dist`; the
        # renderer build that fills dist/ depends on the very bindings
        # `wails generate module` produces. Drop a placeholder so the
        # embed pattern resolves now.
        run: mkdir -p dist && touch dist/.placeholder

      - name: Generate Wails TypeScript bindings
        run: wails generate module

      - name: TypeScript lint (tsc --noEmit)
        run: npm run lint

      - name: Build and release script tests (node:test)
        run: npm run test:scripts

      - name: Renderer tests (vitest)
        run: npx vitest run

      - name: Go tests (normal build)
        run: go test ./... -count=1

      - name: Go tests (demo build)
        run: go test -tags officedex_demo ./... -count=1
